<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>PassVault 密码管家</title>
  <link rel="stylesheet" href="/styles.css?v=1.2.0" />
</head>
<body>
  <!-- 解锁 / 初始化 -->
  <section id="auth-screen">
    <div class="auth-card">
      <div class="auth-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="10" width="18" height="11" rx="2.5"></rect>
          <path d="M7 10V7a5 5 0 0 1 10 0v3"></path>
          <circle cx="12" cy="15.5" r="1.4"></circle>
        </svg>
      </div>
      <h1 id="auth-title">解锁密码库</h1>
      <p class="sub" id="auth-sub">输入主密码以访问你的账号数据</p>
      <form id="auth-form" autocomplete="off">
        <label class="field">
          <span>主密码</span>
          <input class="input" id="auth-password" type="password" autocomplete="current-password" placeholder="请输入主密码" />
        </label>
        <label class="field hidden" id="auth-confirm-wrap">
          <span>确认主密码</span>
          <input class="input" id="auth-confirm" type="password" autocomplete="new-password" placeholder="再次输入主密码" />
        </label>
        <button class="btn primary" id="auth-submit" type="submit" style="width:100%">解锁</button>
        <div class="auth-error" id="auth-error"></div>
        <div class="auth-hint" id="auth-hint"></div>
      </form>
    </div>
  </section>

  <!-- 主界面 -->
  <section id="app-screen" class="hidden">
    <header class="topbar">
      <button class="btn icon ghost" id="menu-toggle" title="平台列表" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
      </button>
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="10" width="18" height="11" rx="2.5"></rect><path d="M7 10V7a5 5 0 0 1 10 0v3"></path></svg>
        </span>
        <span>PassVault</span>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
        <input class="input" id="search" type="search" placeholder="搜索平台、账号、邮箱、备注…" />
      </div>
      <div class="topbar-actions">
        <button class="btn icon ghost" id="btn-settings" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button class="btn icon ghost" id="btn-lock" title="锁定">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="10" width="18" height="11" rx="2.5"></rect><path d="M7 10V7a5 5 0 0 1 10 0v3"></path></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="view-switch">
          <button class="view-btn active" type="button" data-view="passwords">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="10" width="18" height="11" rx="2.5"></rect><path d="M7 10V7a5 5 0 0 1 10 0v3"></path></svg>
            密码
          </button>
          <button class="view-btn" type="button" data-view="memos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>
            备忘录
          </button>
        </div>
        <div id="sidebar-passwords">
          <div class="sidebar-head">
            <span>平台</span>
            <button class="btn icon ghost" id="btn-add-platform" title="新增平台">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
          <div id="platform-nav"></div>
        </div>
        <div id="sidebar-memos" class="hidden">
          <div class="sidebar-head">
            <span>备忘录</span>
            <button class="btn icon ghost" id="btn-add-memo" title="新建备忘录">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
          <div id="memo-nav"></div>
        </div>
      </aside>

      <main class="content">
        <div id="content-passwords">
          <div class="content-head">
            <h2 id="content-title">全部账号</h2>
            <span class="meta" id="content-meta"></span>
            <span class="spacer"></span>
            <button class="btn" id="btn-add-account">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
              新增账号
            </button>
          </div>
          <div id="account-list"></div>
        </div>
        <div id="content-memos" class="hidden"></div>
      </main>
    </div>

    <button class="fab" id="fab-add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      新增账号
    </button>
  </section>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="/app.js?v=1.2.0"></script>
</body>
</html>
